<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado metálico para el marco grisáceo de la pantalla CRT -->
    <linearGradient id="crtBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5056"/>
      <stop offset="100%" stop-color="#22252a"/>
    </linearGradient>

    <!-- Cristal abombado y viñeteado de la pantalla CRT -->
    <radialGradient id="screenGlass" cx="50%" cy="50%" r="55%">
      <stop offset="65%" stop-color="#141619"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
  </defs>

  <!-- MARCO EXTERIOR CRT (Bisel redondeado estilo televisión de tubo) -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="url(#crtBezel)" stroke="#1a1c1e" stroke-width="8"/>
  
  <!-- INTERIOR DE LA PANTALLA CRT -->
  <rect x="48" y="48" width="416" height="416" rx="52" fill="url(#screenGlass)" stroke="#101114" stroke-width="6"/>

  <!-- PAC-MAN (Centrado con la boca abierta apuntando a la "A") -->
  <g transform="translate(225, 256)">
    <!-- Cuerpo de Pac-Man (Radio 135px) -->
    <path d="M 0 0 L 117 -67.5 A 135 135 0 1 0 117 67.5 Z" fill="#FDD835"/>

    <!-- Ojo retro de Pac-Man -->
    <circle cx="15" cy="-72" r="13" fill="#141619"/>

    <!-- LOGO OFICIAL RECTIFICADO DE ARCH LINUX -->
    <!-- Incluye las hendiduras/muescas diagonales en ambos lados y la puerta/arco redondeado interior -->
    <g transform="translate(70, -48) scale(0.15)">
      <path d="M256 1.6c-22.3 55.7-36.6 90.6-62 144.7 15.9 17.5 35 36.6 65.2 57.2-33.4-12.7-55.7-27-71.6-41.3C154.2 230.6 103.4 326 1.6 512c79.5-47.7 143.1-76.3 201.9-87.5-3.2-11.1-4.8-22.3-4.8-35V388c1.6-52.5 28.6-92.2 60.4-89 31.8 1.6 57.2 46.1 55.7 98.6l-3.2 27c57.2 11.1 119.3 41.3 198.8 85.9L467.5 431c-20.7-15.9-42.9-36.6-87.5-60.4 30.2 8 52.5 17.5 70 27C313.2 144.7 302.1 111.3 256 0z" style="fill:#1793d1"/>
    </g>
  </g>

 
</svg>